# Publishes web/ to GitHub Pages. Set the repo's Pages source to
# "GitHub Actions" (Settings -> Pages) once; after that every push to main
# that touches web/ redeploys. web/index.html is a committed copy of
# app/bsn_archivo.html kept current by `make site` (and enforced by
# `make verify`).
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
